# flutter_lints viene aggiunto come dev_dependency da `flutter create` (fase F0).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - tool/fixtures_raw/**
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
